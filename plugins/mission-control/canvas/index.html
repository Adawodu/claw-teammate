<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Mission Control</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171b22; --panel2:#1e242d; --line:#2a313c;
    --txt:#e6eaf0; --dim:#9aa4b2; --accent:#6ea8fe; --good:#39d98a;
    --warn:#ffb454; --bad:#ff6b6b; --chip:#243042;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:10;background:rgba(14,17,22,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    padding:max(env(safe-area-inset-top),10px) 14px 0}
  .title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;padding-bottom:8px}
  .title .dot{width:9px;height:9px;border-radius:50%;background:var(--good);
    box-shadow:0 0 8px var(--good)}
  .title small{margin-left:auto;color:var(--dim);font-weight:500;font-size:12px}
  .row{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
  .row::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);
    color:var(--dim);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
  .pill.active{background:var(--accent);border-color:var(--accent);color:#0b1220;font-weight:600}
  .views{display:flex;gap:4px;border-top:1px solid var(--line);margin-top:2px}
  .view-tab{flex:1;text-align:center;padding:11px 4px;color:var(--dim);font-size:13px;
    font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
  .view-tab.active{color:var(--txt);border-bottom-color:var(--accent)}
  .view-tab .badge{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;
    background:var(--warn);color:#0b1220;border-radius:999px;font-size:11px;font-weight:700}
  main{padding:14px;max-width:760px;margin:0 auto}
  .col-h{display:flex;align-items:center;gap:8px;margin:18px 0 8px;color:var(--dim);
    font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
  .col-h .n{margin-left:auto;background:var(--chip);color:var(--dim);border-radius:999px;
    padding:0 8px;font-size:11px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;margin-bottom:9px}
  .card .top{display:flex;align-items:flex-start;gap:8px}
  .card .ttl{font-weight:600;flex:1}
  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .chip{font-size:11px;color:var(--dim);background:var(--chip);border-radius:6px;padding:2px 7px}
  .chip.agent{color:var(--accent)}
  .chip.type{color:var(--warn)}
  select.status{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:7px;padding:4px 6px;font-size:12px}
  .btns{display:flex;gap:8px;margin-top:11px}
  button.act{flex:1;border:none;border-radius:9px;padding:9px;font-weight:600;font-size:14px;cursor:pointer}
  .approve{background:var(--good);color:#072014}
  .reject{background:transparent;color:var(--bad);border:1px solid var(--bad)!important}
  .add{display:flex;gap:8px;margin-bottom:6px}
  .add input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:9px;padding:10px 12px;font-size:15px}
  .add button{background:var(--accent);color:#0b1220;border:none;border-radius:9px;
    padding:0 16px;font-weight:700;cursor:pointer}
  .feed-item{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
  .feed-item .k{font-size:11px;color:var(--dim);min-width:62px}
  .empty{color:var(--dim);text-align:center;padding:34px 10px;font-size:14px}
  .state{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600}
  .state.approved{background:rgba(57,217,138,.15);color:var(--good)}
  .state.running{background:rgba(110,168,254,.15);color:var(--accent)}
  .state.done{background:var(--chip);color:var(--dim)}
  .state.rejected,.state.failed{background:rgba(255,107,107,.12);color:var(--bad)}
  .hint{color:var(--dim);font-size:12px;margin:2px 0 14px}
</style>
</head>
<body>
<header>
  <div class="title"><span class="dot"></span>Mission Control
    <small id="conn">connecting…</small></div>
  <div class="row" id="wsTabs"></div>
  <div class="views">
    <div class="view-tab active" data-view="board">Board</div>
    <div class="view-tab" data-view="approvals">Approvals<span class="badge" id="apprBadge" style="display:none"></span></div>
    <div class="view-tab" data-view="activity">Activity</div>
  </div>
</header>
<main id="main"><div class="empty">Loading…</div></main>

<script>
// ── Config ─────────────────────────────────────────────────────────
// PROD deployment (fortunate-seahorse-362). This is the live jonnymate target
// (fortunate-seahorse-362.convex.cloud) when promoting to live jonnymate.
const CONVEX_URL = "https://fortunate-seahorse-362.convex.cloud";
const POLL_MS = 5000;

const TASK_COLS = [
  {key:"todo",        label:"To Do"},
  {key:"in_progress", label:"In Progress"},
  {key:"blocked",     label:"Blocked"},
  {key:"done",        label:"Done"},
];
const ALL_STATUS = ["backlog","todo","in_progress","blocked","done"];

let state = { workspaces:[], wsId:null, view:"board" };
let pollTimer = null;

// ── Convex HTTP (same pattern as the dynoclux canvas) ──────────────
async function cq(path, args={}){
  const r = await fetch(CONVEX_URL+"/api/query",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({path,args,format:"json"})});
  const d = await r.json();
  if(d.status!=="success") throw new Error(d.errorMessage||path);
  return d.value;
}
async function cm(path, args={}){
  const r = await fetch(CONVEX_URL+"/api/mutation",{method:"POST",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({path,args,format:"json"})});
  const d = await r.json();
  if(d.status!=="success") throw new Error(d.errorMessage||path);
  return d.value;
}

const $ = s => document.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = ts => new Date(ts).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});

// ── Boot ───────────────────────────────────────────────────────────
async function boot(){
  try{
    state.workspaces = await cq("missionControl:listWorkspaces");
    $("#conn").textContent = "live";
    if(!state.wsId && state.workspaces[0]) state.wsId = state.workspaces[0]._id;
    renderTabs();
    await render();
    startPoll();
  }catch(e){ $("#conn").textContent="offline"; $("#main").innerHTML=`<div class="empty">Can't reach Convex.<br><small>${esc(e.message)}</small></div>`; }
}
function startPoll(){ clearInterval(pollTimer); pollTimer=setInterval(()=>render(true),POLL_MS); }

function renderTabs(){
  $("#wsTabs").innerHTML = state.workspaces.map(w=>
    `<div class="pill ${w._id===state.wsId?"active":""}" data-ws="${w._id}">${w.emoji||""} ${esc(w.name)}</div>`).join("");
  document.querySelectorAll("[data-ws]").forEach(el=>el.onclick=()=>{state.wsId=el.dataset.ws;renderTabs();render();});
}
document.querySelectorAll(".view-tab").forEach(t=>t.onclick=()=>{
  state.view=t.dataset.view;
  document.querySelectorAll(".view-tab").forEach(x=>x.classList.toggle("active",x===t));
  render();
});

// ── Render ─────────────────────────────────────────────────────────
async function render(silent){
  if(!state.wsId) return;
  // keep the approvals badge fresh regardless of view
  try{
    const pend = await cq("missionControl:listActions",{workspaceId:state.wsId,state:"proposed"});
    const b=$("#apprBadge"); if(pend.length){b.style.display="";b.textContent=pend.length;}else b.style.display="none";
  }catch{}
  if(state.view==="board")     return renderBoard(silent);
  if(state.view==="approvals") return renderApprovals();
  if(state.view==="activity")  return renderActivity();
}

async function renderBoard(silent){
  const tasks = await cq("missionControl:listTasks",{workspaceId:state.wsId});
  let html = `<div class="add">
      <input id="newTask" placeholder="Add a task…" />
      <button onclick="addTask()">Add</button></div>
    <div class="hint">You drive. The agent proposes; actions wait in Approvals until you say go.</div>`;
  for(const col of TASK_COLS){
    const items = tasks.filter(t=>t.status===col.key);
    html += `<div class="col-h">${col.label}<span class="n">${items.length}</span></div>`;
    if(!items.length){ html += `<div class="empty" style="padding:10px">—</div>`; continue; }
    for(const t of items){
      html += `<div class="card"><div class="top"><div class="ttl">${esc(t.title)}</div>
        <select class="status" onchange="setStatus('${t._id}',this.value)">
          ${ALL_STATUS.map(s=>`<option value="${s}" ${s===t.status?"selected":""}>${s.replace("_"," ")}</option>`).join("")}
        </select></div>
        <div class="meta">
          <span class="chip">${t.origin==="agent"?"🤖 agent":"🧑 you"}</span>
          ${t.assignedAgent?`<span class="chip agent">@${esc(t.assignedAgent)}</span>`:""}
        </div></div>`;
    }
  }
  $("#main").innerHTML = html;
}

async function renderApprovals(){
  const [pending, recent] = await Promise.all([
    cq("missionControl:listActions",{workspaceId:state.wsId,state:"proposed"}),
    cq("missionControl:listActions",{workspaceId:state.wsId}),
  ]);
  let html = `<div class="col-h">Awaiting your call<span class="n">${pending.length}</span></div>`;
  if(!pending.length) html += `<div class="empty">Nothing waiting. The agent will queue actions here for approval.</div>`;
  for(const a of pending){
    html += `<div class="card"><div class="ttl">${esc(a.summary)}</div>
      <div class="meta"><span class="chip type">${esc(a.type)}</span>
        ${a.proposedByAgent?`<span class="chip agent">@${esc(a.proposedByAgent)}</span>`:""}
        <span class="chip">${fmt(a.createdAt)}</span></div>
      <div class="btns">
        <button class="act approve" onclick="decide('${a._id}','approve')">✓ Approve</button>
        <button class="act reject" onclick="decide('${a._id}','reject')">Reject</button>
      </div></div>`;
  }
  const done = recent.filter(a=>a.state!=="proposed").slice(0,8);
  if(done.length){
    html += `<div class="col-h" style="margin-top:24px">Recent</div>`;
    for(const a of done){
      html += `<div class="card"><div class="top"><div class="ttl" style="font-weight:500">${esc(a.summary)}</div>
        <span class="state ${a.state}">${a.state}</span></div></div>`;
    }
  }
  $("#main").innerHTML = html;
}

async function renderActivity(){
  const feed = await cq("missionControl:listActivity",{workspaceId:state.wsId,limit:60});
  if(!feed.length){ $("#main").innerHTML = `<div class="empty">No activity yet. The agent's reasoning and tool calls will stream here.</div>`; return; }
  $("#main").innerHTML = feed.map(f=>
    `<div class="feed-item"><div class="k">${esc((f.kind||"").toUpperCase())}</div>
      <div><div>${esc(f.text)}</div>
      <div class="chip" style="margin-top:4px">${f.agent?("@"+esc(f.agent)+" · "):""}${fmt(f.createdAt)}</div></div></div>`).join("");
}

// ── Actions ────────────────────────────────────────────────────────
async function addTask(){
  const i=$("#newTask"); const title=i.value.trim(); if(!title) return;
  i.value=""; await cm("missionControl:createTask",{workspaceId:state.wsId,title,origin:"human"}); render();
}
async function setStatus(id,status){ await cm("missionControl:updateTask",{id,status}); render(); }
async function decide(id,decision){ await cm("missionControl:decideAction",{id,decision}); render(); }
window.addTask=addTask; window.setStatus=setStatus; window.decide=decide;

boot();
</script>
</body>
</html>
